name: Update llama.cpp version

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install PyYAML
        run: pip install PyYAML

      - name: Fetch latest stable llama.cpp tag
        id: fetch-tag
        run: |
          LATEST_TAG=$(python3 -c '
          import urllib.request
          import json
          import sys
          url = "https://api.github.com/repos/ggml-org/llama.cpp/releases"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  for release in data:
                      assets = [a["name"] for a in release.get("assets", [])]
                      if any("ubuntu-x64.tar.gz" in a for a in assets):
                          print(release["tag_name"])
                          sys.exit(0)
          except Exception as e:
              print(f"Error fetching releases: {e}", file=sys.stderr)
              sys.exit(1)
          ')
          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to retrieve latest tag"
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if update is needed
        id: check-update
        run: |
          CURRENT_TAG=$(cat llamacpp/llama_version.txt)
          NEW_TAG=${{ steps.fetch-tag.outputs.tag }}
          
          if [ "$CURRENT_TAG" != "$NEW_TAG" ]; then
            echo "New version found: $NEW_TAG (current: $CURRENT_TAG)"
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
            
            # Update version file
            echo "$NEW_TAG" > llamacpp/llama_version.txt
            
            # Bump patch version in config.yaml
            python3 -c '
            import yaml
            
            class quoted_str(str):
                pass
                
            def quoted_scalar_representer(dumper, data):
                return dumper.represent_scalar("tag:yaml.org,2002:str", data, style="\"")
                
            yaml.add_representer(quoted_str, quoted_scalar_representer)
            
            with open("llamacpp/config.yaml", "r") as f:
                config = yaml.safe_load(f)
                
            version_parts = config["version"].split(".")
            version_parts[2] = str(int(version_parts[2]) + 1)
            new_version = ".".join(version_parts)
            config["version"] = quoted_str(new_version)
            
            with open("llamacpp/config.yaml", "w") as f:
                yaml.dump(config, f, default_flow_style=False, sort_keys=False)
                
            print(new_version)
            ' > /tmp/new_addon_version.txt
            
            echo "new_addon_version=$(cat /tmp/new_addon_version.txt)" >> $GITHUB_OUTPUT
          else
            echo "Already up to date ($CURRENT_TAG)"
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-update.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(llamacpp): update to ${{ steps.check-update.outputs.new_tag }}\n\nBump addon version to ${{ steps.check-update.outputs.new_addon_version }}"
          title: "Update llama.cpp to ${{ steps.check-update.outputs.new_tag }}"
          body: |
            This PR automatically updates `llama.cpp` to the latest stable release `${{ steps.check-update.outputs.new_tag }}`.
            
            It also bumps the add-on version to `${{ steps.check-update.outputs.new_addon_version }}`.
            
            The automated tests will run against this branch. If they pass, you can safely merge this PR to release the update.
          branch: "update-llamacpp-${{ steps.check-update.outputs.new_tag }}"
          base: main
