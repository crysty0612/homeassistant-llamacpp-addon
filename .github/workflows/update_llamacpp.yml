name: Update llama.cpp version

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install PyYAML
        run: pip install PyYAML

      - name: Fetch latest stable llama.cpp tag
        id: fetch-tag
        run: |
          LATEST_TAG=$(python3 -c '
          import urllib.request
          import json
          import sys
          url = "https://api.github.com/repos/ggml-org/llama.cpp/releases"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  # Sort releases by published_at descending
                  data.sort(key=lambda x: x.get("published_at", ""), reverse=True)
                  for release in data:
                      assets = [a["name"] for a in release.get("assets", [])]
                      if any("ubuntu-x64.tar.gz" in a for a in assets):
                          print(release["tag_name"])
                          sys.exit(0)
          except Exception as e:
              print(f"Error fetching releases: {e}", file=sys.stderr)
              sys.exit(1)
          ')
          if [ -z "$LATEST_TAG" ]; then
            echo "Failed to retrieve latest tag"
            exit 1
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Check if update is needed
        id: check-update
        run: |
          CURRENT_TAG=$(cat llamacpp/llama_version.txt)
          NEW_TAG=${{ steps.fetch-tag.outputs.tag }}
          
          if [ "$CURRENT_TAG" != "$NEW_TAG" ]; then
            echo "New version found: $NEW_TAG (current: $CURRENT_TAG)"
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
            
            # Update version file
            echo "$NEW_TAG" > llamacpp/llama_version.txt
            
            # Bump patch version in config.yaml
          python3 -c '
import yaml

class quoted_str(str):
    pass
    
def quoted_scalar_representer(dumper, data):
    return dumper.represent_scalar("tag:yaml.org,2002:str", data, style="\"")
    
yaml.add_representer(quoted_str, quoted_scalar_representer)

with open("llamacpp/config.yaml", "r") as f:
    config = yaml.safe_load(f)
    
version_parts = config["version"].split(".")
version_parts[2] = str(int(version_parts[2]) + 1)
new_version = ".".join(version_parts)
config["version"] = quoted_str(new_version)

with open("llamacpp/config.yaml", "w") as f:
    yaml.dump(config, f, default_flow_style=False, sort_keys=False)
    
print(new_version)
' > /tmp/new_addon_version.txt
            
            # Update README files with the new llama.cpp tag
            sed -i "s|runs on \*\*llama.cpp\*\* \[[^]]*\](https://github.com/ggml-org/llama.cpp/releases/tag/[^)]*)|runs on **llama.cpp** [$NEW_TAG](https://github.com/ggml-org/llama.cpp/releases/tag/$NEW_TAG)|g" README.md
            sed -i "s|runs on \*\*llama.cpp\*\* \[[^]]*\](https://github.com/ggml-org/llama.cpp/releases/tag/[^)]*)|runs on **llama.cpp** [$NEW_TAG](https://github.com/ggml-org/llama.cpp/releases/tag/$NEW_TAG)|g" llamacpp/README.md
            
            echo "new_addon_version=$(cat /tmp/new_addon_version.txt)" >> $GITHUB_OUTPUT
          else
            echo "Already up to date ($CURRENT_TAG)"
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check-update.outputs.update_needed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          docker build --build-arg BUILD_FROM=ubuntu:24.04 -t llamacpp-addon-test ./llamacpp

      - name: Test Container Boot and Model Pulling
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          # Start the container with the mocked options
          docker run -d --name llamacpp-test-instance \
            -p 8080:8080 \
            -v ${{ github.workspace }}/test/options.json:/data/options.json \
            llamacpp-addon-test

          # Wait for the server to start (timeout after 5 minutes)
          echo "Waiting for server to respond on port 8080..."
          timeout 300 bash -c 'until curl -s http://localhost:8080/health > /dev/null; do sleep 5; done'
          
          echo "Server started successfully!"

      - name: Show Container Logs on Failure
        if: failure() && steps.check-update.outputs.update_needed == 'true'
        run: docker logs llamacpp-test-instance

      - name: Cleanup
        if: always() && steps.check-update.outputs.update_needed == 'true'
        run: |
          docker stop llamacpp-test-instance || true
          docker rm llamacpp-test-instance || true

      - name: Commit and Push
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add llamacpp/llama_version.txt llamacpp/config.yaml README.md llamacpp/README.md
          git commit -m "chore(llamacpp): update to ${{ steps.check-update.outputs.new_tag }}" -m "Bump addon version to ${{ steps.check-update.outputs.new_addon_version }}"
          git push
          
          VERSION="${{ steps.check-update.outputs.new_addon_version }}"
          TAG_NAME="v$VERSION"
          BRANCH_NAME="version_$VERSION"
          
          # Create and push branch
          git checkout -b "$BRANCH_NAME"
          git push origin "$BRANCH_NAME"
          
          # Create and push tag
          git checkout main
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"
          
          # Create GitHub Release
          GH_TOKEN=${{ secrets.GITHUB_TOKEN }} gh release create "$TAG_NAME" --title "Release $TAG_NAME" --notes "Automated release for version $VERSION updating llama.cpp to ${{ steps.check-update.outputs.new_tag }}."
