configuration:
  LLAMACPP_USE_CASE:
    name: "Use Case (Text vs Vision)"
    description: "Select 'vision' if you intend to send images to this server. Warning: 'vision' disables speculative decoding to prevent crashes."
  LLAMACPP_MODEL_DIR:
    name: Model Directory
    description: Directory where the downloaded models are stored. Ensure sufficient space.
  LLAMACPP_MODEL:
    name: Main Model (Hugging Face)
    description: "REQUIRED. Format: 'org/repo:filename_or_pattern'. Example: 'Qwen/Qwen2.5-0.5B-Instruct-GGUF:qwen2.5-0.5b-instruct-q4_k_m.gguf' or 'unsloth/Qwen3.5-9B-GGUF:UD-Q4_K_XL'."
  LLAMACPP_DRAFTER:
    name: Drafter Model (Optional)
    description: "Format: 'org/repo:filename_or_pattern'. Leave blank if not using an external drafter model."
  LLAMACPP_DRAFTER_TYPE:
    name: Drafter Type
    description: "Type of speculative decoding. Select 'none' if disabled, 'mtp' for built-in/external Multi-Token Prediction, or 'dflash' for DFlash."
  LLAMACPP_VULKAN:
    name: Enable Vulkan (GPU)
    description: Use Vulkan-enabled llama.cpp binary for GPU acceleration.
  LLAMACPP_GPU_PATH:
    name: GPU Device Path
    description: The Linux device path for your GPU (e.g., /dev/dri/renderD128). MUST be passed to use Vulkan.
  LLAMACPP_CTX_SIZE:
    name: Context Size
    description: Size of the prompt context (default 4096).
  LLAMACPP_THREADS:
    name: CPU Threads
    description: Number of threads to use during generation.
  LLAMACPP_BATCH_SIZE:
    name: Batch Size
    description: Logical maximum batch size (default 512).
  LLAMACPP_PARALLEL:
    name: Parallel Requests
    description: Number of parallel requests to handle (max loaded slots).
  LLAMACPP_FLASH_ATTN:
    name: Flash Attention
    description: Enable flash attention for faster inference (recommended).
  LLAMACPP_HF_TOKEN:
    name: Hugging Face Token (Optional)
    description: "Provide a Hugging Face token (starting with 'hf_') to download gated models or increase rate limits."
