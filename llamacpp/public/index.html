<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llama.cpp Add-on Health</title>
    <style>
        :root {
            --bg-color: #111111;
            --card-bg: #1c1c1c;
            --text-main: #e1e1e1;
            --text-muted: #888888;
            --primary: #03a9f4;
            --success: #4caf50;
            --warning: #ff9800;
            --danger: #f44336;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }
        h1 {
            font-size: 24px;
            margin: 0;
            font-weight: 500;
        }
        .status-badge {
            margin-left: auto;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            background-color: var(--warning);
            color: #000;
        }
        .status-badge.ok {
            background-color: var(--success);
            color: #fff;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 {
            font-size: 16px;
            margin-top: 0;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .metric {
            margin-bottom: 15px;
        }
        .metric:last-child {
            margin-bottom: 0;
        }
        .metric-label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .metric-value {
            font-size: 18px;
            font-weight: 500;
            word-break: break-all;
        }
        .highlight {
            color: var(--primary);
        }
        .slots-container {
            margin-top: 20px;
        }
        .slot {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .slot-idle { border-left: 4px solid var(--text-muted); }
        .slot-busy { border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

    <div class="header">
        <h1>llama.cpp Server Dashboard</h1>
        <div id="health-badge" class="status-badge">Connecting...</div>
    </div>

    <img id="dashboard-banner" alt="llama.cpp Add-on Banner" style="max-width: 100%; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: block;">

    <div class="grid">
        <div class="card">
            <h2>Model Info</h2>
            <div class="metric">
                <div class="metric-label">Loaded Model Path</div>
                <div class="metric-value highlight" id="model-path">Fetching...</div>
            </div>
            <div class="metric">
                <div class="metric-label">Model Type</div>
                <div class="metric-value" id="system-info" style="font-size: 14px;">Fetching...</div>
            </div>
        </div>

        <div class="card">
            <h2>Context & Generation</h2>
            <div class="metric">
                <div class="metric-label">Context Size (Tokens)</div>
                <div class="metric-value" id="ctx-size">Fetching...</div>
            </div>
            <div class="metric">
                <div class="metric-label">Current Configuration</div>
                <div class="metric-value" style="font-size: 14px;">See add-on logs for Drafter, Vulkan, and Batch Size status.</div>
            </div>
        </div>
    </div>

    <div class="card slots-container">
        <h2>Active Request Slots</h2>
        <div id="slots-list">
            <p style="color: var(--text-muted)">Loading slots...</p>
        </div>
    </div>

    <script>
        async function fetchMetrics() {
            // Home Assistant Ingress hosts the add-on at a subpath (e.g., /api/hassio_ingress/xxxxxx).
            // We must dynamically prepend this base path to our API calls.
            const basePath = window.location.pathname.replace(/\/$/, '');
            
            // Set the banner image
            document.getElementById('dashboard-banner').src = `${basePath}/logo.png`;
            
            try {
                // Fetch Health
                const healthRes = await fetch(`${basePath}/health`);
                const health = await healthRes.json();
                const badge = document.getElementById('health-badge');
                if (health.status === 'ok') {
                    badge.textContent = 'Running';
                    badge.className = 'status-badge ok';
                } else {
                    badge.textContent = health.status || 'Starting...';
                    badge.className = 'status-badge';
                }

                let isRouterMode = false;
                let firstProps = null;

                // Try fetching global props (Works in standard mode, fails with 400 in router mode)
                const globalPropsRes = await fetch(`${basePath}/props`);
                if (globalPropsRes.ok) {
                    firstProps = await globalPropsRes.json();
                } else if (globalPropsRes.status === 400) {
                    isRouterMode = true;
                }

                const slotsList = document.getElementById('slots-list');
                let totalSlotsHtml = '';

                if (!isRouterMode) {
                    // STANDARD MODE
                    const slotsRes = await fetch(`${basePath}/slots`);
                    if (slotsRes.ok) {
                        const slots = await slotsRes.json();
                        if (slots && slots.length > 0) {
                            totalSlotsHtml = slots.map(s => renderSlot(s)).join('');
                        }
                    }
                } else {
                    // ROUTER MODE
                    try {
                        const modelsRes = await fetch(`${basePath}/v1/models`);
                        if (modelsRes.ok) {
                            const modelsData = await modelsRes.json();
                            if (modelsData && modelsData.data) {
                                for (const m of modelsData.data) {
                                    const modelId = m.id;
                                    const isLoaded = m.status && m.status.value === 'loaded';
                                    
                                    if (modelsData.data.length > 1) {
                                        totalSlotsHtml += `<h3 style="font-size: 14px; margin: 10px 0 5px 0; color: var(--text-color);">Model: ${modelId}</h3>`;
                                    }
                                    
                                    if (isLoaded) {
                                        if (!firstProps) {
                                            const pRes = await fetch(`${basePath}/props?model=${encodeURIComponent(modelId)}`);
                                            if (pRes.ok) firstProps = await pRes.json();
                                        }
                                        const sRes = await fetch(`${basePath}/slots?model=${encodeURIComponent(modelId)}`);
                                        if (sRes.ok) {
                                            const slots = await sRes.json();
                                            if (slots && slots.length > 0) {
                                                totalSlotsHtml += slots.map(s => renderSlot(s)).join('');
                                            }
                                        }
                                    } else {
                                        totalSlotsHtml += `
                                        <div class="slot slot-idle">
                                            <div><strong>Status</strong> - Unloaded (Standby)</div>
                                            <div style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">
                                                Waiting for API request to load into memory...
                                            </div>
                                        </div>
                                        `;
                                    }
                                }
                            }
                        }
                    } catch (e) {
                        console.error("Router mode failed to fetch models:", e);
                    }
                }

                // Update UI
                if (firstProps) {
                    document.getElementById('model-path').textContent = firstProps.model_path || 'Unknown';
                    document.getElementById('ctx-size').textContent = firstProps.default_generation_settings?.n_ctx || 'Unknown';
                    document.getElementById('system-info').textContent = firstProps.model_ftype || 'Unknown';
                }

                if (totalSlotsHtml) {
                    slotsList.innerHTML = totalSlotsHtml;
                } else {
                    slotsList.innerHTML = `<p style="color: var(--text-muted)">No slots configured or active.</p>`;
                }
                
            } catch (err) {
                const badge = document.getElementById('health-badge');
                badge.textContent = 'Offline';
                badge.className = 'status-badge';
                console.error("Fetch error: ", err);
            }
        }

        function renderSlot(s) {
            const isProcessing = s.is_processing === true;
            const promptTotal = s.n_prompt_tokens || 0;
            const promptDone = s.n_prompt_tokens_processed || 0;
            const nDecoded = (s.next_token && s.next_token[0]) ? s.next_token[0].n_decoded : 0;
            const nRemain = (s.next_token && s.next_token[0]) ? s.next_token[0].n_remain : 0;
            
            return `
            <div class="slot ${!isProcessing ? 'slot-idle' : 'slot-busy'}">
                <div><strong>Slot ${s.id}</strong> - ${!isProcessing ? 'Idle' : 'Processing'}</div>
                <div style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">
                    ${isProcessing ? `Prefill: ${promptDone}/${promptTotal} | Decode: ${nDecoded} generated (${nRemain} remain)` : `Ready`}
                </div>
            </div>
            `;
        }

        // Poll every 2 seconds
        setInterval(fetchMetrics, 2000);
        fetchMetrics();
    </script>
</body>
</html>
